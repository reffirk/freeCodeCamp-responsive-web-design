<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Player</title>
  </head>
  <body>
    <main>
      <h1>Multimedia Player</h1>
      <section>
        <h2>Sailing Away</h2>
        <audio loop controls aria-label="volume-label volume-description" type="audio">
          <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio">
        </audio>
      </section>

      <section>
        <h2>What is the map method and how does it work?</h2>
        <video src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" width="640" loop controls muted aria-label="volume-label volume-description">
          <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" type="video/mp4">
          <track default kind="captions" srclang="en" label="English" src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"/>
        </video>
      </section>

      <section>
        <h2>Transcript</h2>
        <p>Lorem Ipsum Dolor Sit Amet</p>
      </section>
    </main>
    
    <footer>
      <p>No Copyright - <a href="https://www.freecodecamp.org">freeCodeCamp.org</a></p>
    </footer>
  </body>
</html>
