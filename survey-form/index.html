<!DOCTYPE html>
<html lang="en">
  <head>    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
  </head>
  <body>
    <main>
      <h1 id="title">Survey Form</h1>
      <p id="description">Lorem Ipsum Dolor</p>
      <form method="POST" action="https://hotel-feedback.freecodecamp.org" id="survey-form">
        <fieldset>
          <legend>Lorem Ipsum Dolor</legend>
          <label for="full-name" id="name-label">Name (required):</label>
          <input type="text" id="name" name="name" placeholder="Lorem Ipsum" required size="20">
          <label for="email" id="email-label">Email address (required):</label>
          <input placeholder="example@email.com" required id="email" type="email" name="email" size="20"/>
          <label for="age" id="number-label">Age (optional):</label>
          <input type="number" name="age" id="number" placeholder="0" min="3" max="100" />
        </fieldset>
        <fieldset>
          <legend>Lorem Ipsum Dolor</legend>
          <select name="dropdown" id="dropdown">
            <option>Lorem Ipsum Dolor</option>
            <option>Lorem Ipsum Dolor</option>
            <option>Lorem Ipsum Dolor</option>
            <option>Lorem Ipsum Dolor</option>
            <option>Lorem Ipsum Dolor</option>
          </select>
        </fieldset>
        <fieldset>
          <legend>Lorem Ipsum Dolor</legend>
          <input id="lorem" type="radio" name="lorem" value="lorem" />
          <input id="lorem" type="radio" name="lorem" value="lorem" />
        </fieldset>
        <fieldset>
          <legend>Lorem Ipsum Dolor</legend>
          <input type="checkbox" id="ads" name="lorem" value="lorem" />
          <input type="checkbox" id="ads" name="lorem" value="lorem" />
        </fieldset>
        <fieldset>
          <label for="comments">Other Comments?</label>
          <textarea cols="30" rows="10" name="comments" id="comments"></textarea>
          <button id="submit" type="submit">Submit</button>
        </fieldset>
      </section>
    </main>
    <footer>
      <p>No Copyright - <a href="https://www.freecodecamp.org">freeCodeCamp.org</a></p>
    </footer>
  </body>
</html>
