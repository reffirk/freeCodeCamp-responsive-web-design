<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with the HTML Audio Element.</title>
  </head>
  <body>
    <section>
      <h1>This is a Video and Audio site</h1>
      <h2>This is a Video</h2>
      <video width="640" loop controls muted poster="https://cdn.freecodecamp.org/curriculum/labs/past-event2.jpg">
        <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
        <source src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.webm" type="video/webm">
        <source src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.ogg" type="video/ogg">
        <source src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.mov" type="video/quicktime">    
      </video>
    </section>
    <section>
      <h2>Can't Stay Down</h2>
      <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/can't-stay-down.mp3" loop controls></audio>
    </section>
  </body>
</html>
