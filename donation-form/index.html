<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Form</title>
  </head>
  <body>
    <h1>Donation Form</h1>
    <form>

      <label for="name">Full Name:</label>
      <input required type="text" id="name" name="name" value="name"/>

      <label for="email">Email Address:</label>
      <input required type="email" id="email" name="email" value="email"/>

      <label for="donation">Donation Amount ($):</label>
      <input required type="number" id="donation" name="amount" value="donation"/>

      <input type="checkbox" id="subscribe" name="newsletter" value="subscription"/>
      <label for="subscribe">Subscribe</label>

      <input type="submit" value="Send"/>
    </form>
  </body>
</html>
