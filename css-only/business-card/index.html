<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../business-card/assets/css/styles.css">
    <title>Business Card</title>
  </head>
  <body>
    <div class="business-card">
      <main>
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="profile-image"/>
        <p class="full-name">Lorem Ipsum Dolor Sit Amet</p>
        <p class="designation">Lorem Ipsum Dolor Sit Amet</p>
        <p class="company">Lorem Ipsum Dolor Sit Amet</p> 
        <hr class="bottom-line">
        <p class="phone-number">Lorem Ipsum Dolor Sit Amet</p> 

        <a href="#" class="portfolio-link">Portfolio</a>
        <hr class="bottom-line">

        <div class="social-media">
          <h2>Connect with me</h2>
          <ul class="social-media-links">
            <li class="link"><a href="#" target="_blank">Twitter</a></li>
            <li class="link"><a href="#" target="_blank">LinkedIn</a></li>
            <li class="link"><a href="#" target="_blank">GitHub</a></li>
          </ul>
        </div>
        
        <hr class="bottom-line">
        
        <footer>
          <address>
            <p><a href="https://www.freecodecamp.org" target="_blank">Visit our website</a></p>
            <p class="address">123 Free Code Camp Drive</p>
          </address>
          <p>No Copyright - <a href="https://www.freecodecamp.org" target="_blank">freeCodeCamp.org</a></p>
        </footer>
      </main>
    </div>
  </body>
</html>
